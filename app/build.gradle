plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.sunchu.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.sunchu.launcher'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
